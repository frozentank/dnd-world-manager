apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dnd-world
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_DB, value: dnd_world}
            - {name: POSTGRES_USER, value: dnd}
            - {name: POSTGRES_PASSWORD, value: change-me}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dnd-world
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
